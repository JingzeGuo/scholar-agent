# Evaluation configuration (Phase 8)
# All systems run on the identical frozen split under data/evaluation/.

dataset:
  questions_path: data/evaluation/questions.jsonl
  reference_evidence_path: data/evaluation/reference_evidence.jsonl
  frozen_split_path: data/evaluation/frozen_split.json

systems:
  - naive_dense
  - hybrid_rag
  - hybrid_rerank
  - hybrid_graph
  - hybrid_corrective
  - full_agent
  - static_all_tools

metrics:
  retrieval:
    - recall_at_k
    - mrr
    - ndcg_at_k
  citation:
    - citation_precision
    - citation_recall
    - citation_validity_rate
    - page_traceability_rate
    - unsupported_claim_rate
  answer:
    - claim_overlap
    - claim_correctness       # deterministic lexical proxy
    - completeness            # reference-claim lexical recall proxy
    - token_f1
    - refusal_correct
    - faithfulness_proxy
    - ragas_faithfulness   # optional (--ragas)
    - ragas_answer_relevancy
    - contradiction_handling_accuracy
  agents_and_operations:
    - plan_coverage
    - tool_selection_accuracy
    - corrective_trigger_precision
    - improvement_after_correction
    - input_tokens
    - output_tokens
    - error_rate

budgets:
  max_questions: 50
  max_latency_ms_per_question: 120000
  use_live_llm: false

output:
  dir: outputs/evaluation
  write_charts: true

# Set to the effective provider price when running paid generation/RAGAS.
cost:
  usd_per_1k_tokens: 0.0

random_seed: 0
