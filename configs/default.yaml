# ScholarAgent default configuration (Phase 0+)

project:
  name: scholar-agent
  version: "0.1.0"

paths:
  data_dir: data
  papers_dir: data/papers
  processed_dir: data/processed
  indexes_dir: data/indexes
  evaluation_dir: data/evaluation
  corpus_manifest: data/corpus_manifest.jsonl

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  main_model: deepseek-v4-pro
  fast_model: deepseek-v4-flash
  temperature: 0.0
  max_tokens: 4096
  request_timeout_s: 60
  max_retries: 3
  # Prefer non-thinking for structured extraction / classification
  thinking_enabled: false

budgets:
  max_tool_calls_per_research_pass: 4
  max_corrective_iterations: 3
  max_evidence_per_sub_question: 8
  max_total_tokens: 100000
  max_latency_ms: 120000

retrieval:
  dense:
    model_name: BAAI/bge-small-en-v1.5
    top_k: 12
    collection_name: scholar_chunks
  sparse:
    top_k: 12
  fusion:
    method: rrf
    k: 60
    fused_top_k: 20
  reranker:
    model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
    top_k: 8
  graph:
    max_hops: 2

chunking:
  target_tokens: 600
  overlap_tokens: 80
  min_tokens: 80

logging:
  level: INFO
  json_logs: false
