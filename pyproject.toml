[project]
name = "scholar-agent"
version = "0.2.0"
description = "A compact multi-agent GraphRAG system for evidence-grounded academic research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ScholarAgent" }]
keywords = ["rag", "agents", "literature", "graphrag", "langgraph"]
dependencies = [
    "langgraph>=0.2",
    "networkx>=3.3",
    "numpy>=1.26",
    "openai>=1.40",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "rank-bm25>=0.2",
    "sentence-transformers>=3.0",
    "typer>=0.12",
]

[project.scripts]
scholar-agent = "scholar_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_agent"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: tests that call paid or live providers (opt-in)",
]
addopts = "-q --strict-markers -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["scholar_agent"]
